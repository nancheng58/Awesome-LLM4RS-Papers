name: Add PGPO entry

on:
  push:
    branches:
      - add-pgpo-emnlp2026

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: add-pgpo-emnlp2026
      - name: Add PGPO to paper list
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          text = p.read_text()
          entry = '+ PGPO: Prototype-Guided Progressive Obfuscation for Privacy-Preserving LLM-Enhanced Recommendation, EMNLP 2026 Main, [[paper]](https://aclanthology.org/2026.emnlp-main.480/), [[code]](https://github.com/Shengxiang-Lin/PGPO).'
          if entry not in text:
              anchor = '\n### Agent4Rec'
              if anchor not in text:
                  raise SystemExit('Anchor not found')
              text = text.replace(anchor, '\n' + entry + '\n' + anchor, 1)
              p.write_text(text)
          PY
      - name: Commit change
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Add PGPO (EMNLP 2026)"
          git push
